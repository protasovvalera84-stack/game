###############################################################################
# OpenGame Studio — Docker Compose
#
# По умолчанию использует Groq (бесплатный облачный LLM).
# Ollama (офлайн) — опционально, раскомментируйте секцию ниже.
#
# Быстрый старт:
#   cp .env.docker .env          # вставьте Groq ключ в .env
#   docker compose up -d --build
#   open http://localhost:4000
###############################################################################

name: opengame

services:

  # ── OpenGame: веб-интерфейс + API ─────────────────────────────────────────
  opengame:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: opengame-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:4000"
    volumes:
      - games-data:/data/games
      - installers-data:/data/installers:ro
    environment:
      # ── AI провайдер (из .env) ───────────────────────────────────────────
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-llama-3.3-70b-versatile}
      # ── Генерация изображений (необязательно) ────────────────────────────
      - OPENGAME_IMAGE_PROVIDER=${OPENGAME_IMAGE_PROVIDER:-}
      - OPENGAME_IMAGE_API_KEY=${OPENGAME_IMAGE_API_KEY:-}
      - OPENGAME_IMAGE_MODEL=${OPENGAME_IMAGE_MODEL:-}
      # ── Пути ─────────────────────────────────────────────────────────────
      - SERVER_PORT=4000
      - GAMES_DIR=/data/games
      - INSTALLERS_DIR=/data/installers
      - WEB_UI_DIST=/app/web-ui/dist
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Сборщик установщиков (запускается один раз) ───────────────────────────
  installer-builder:
    build:
      context: .
      dockerfile: Dockerfile.builder
    container_name: opengame-installer-builder
    restart: "no"
    volumes:
      - installers-data:/data/installers
    environment:
      - OUTPUT_DIR=/data/installers

  # ═══════════════════════════════════════════════════════════════════════════
  # OLLAMA — локальный офлайн режим (раскомментируйте если нужен)
  #
  # Чтобы включить:
  #   1. Раскомментируйте секции ollama и ollama-pull ниже
  #   2. В .env установите:
  #        OPENAI_BASE_URL=http://ollama:11434/v1
  #        OPENAI_API_KEY=ollama
  #        OPENAI_MODEL=qwen2.5-coder:7b
  #   3. docker compose up -d --build
  # ═══════════════════════════════════════════════════════════════════════════

