<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7c3aed"/>
      <stop offset="50%"  stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="96" ry="96" fill="rgba(255,255,255,0.06)"/>

  <!-- Gamepad body -->
  <rect x="96" y="184" width="320" height="200" rx="40" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.25)" stroke-width="4"/>

  <!-- D-pad: left -->
  <rect x="128" y="260" width="24" height="48" rx="4" fill="url(#glow)"/>
  <rect x="112" y="276" width="56" height="24" rx="4" fill="url(#glow)"/>

  <!-- Action buttons: right -->
  <circle cx="344" cy="260" r="14" fill="rgba(255,255,255,0.7)"/>
  <circle cx="376" cy="284" r="14" fill="rgba(167,139,250,0.9)"/>
  <circle cx="312" cy="284" r="14" fill="rgba(103,232,249,0.9)"/>
  <circle cx="344" cy="308" r="14" fill="rgba(110,231,183,0.9)"/>

  <!-- Center: analog/menu buttons -->
  <rect x="228" y="276" width="20" height="12" rx="6" fill="rgba(255,255,255,0.4)"/>
  <rect x="264" y="276" width="20" height="12" rx="6" fill="rgba(255,255,255,0.4)"/>

  <!-- L/R shoulder bumpers -->
  <rect x="96" y="164" width="100" height="28" rx="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
  <rect x="316" y="164" width="100" height="28" rx="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>

  <!-- Sparkle top-right -->
  <circle cx="408" cy="108" r="6" fill="rgba(255,255,255,0.6)"/>
  <circle cx="420" cy="92"  r="4" fill="rgba(167,139,250,0.8)"/>
  <circle cx="392" cy="96"  r="3" fill="rgba(103,232,249,0.8)"/>
</svg>
